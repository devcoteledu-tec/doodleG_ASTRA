name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Placeholder env values satisfy src/lib/env.ts's boot-time validation
    # (which distinguishes "required in all environments" from "required in
    # production only" — see instrumentation.ts). No real secrets are needed
    # because every test mocks Supabase/Gemini/Twilio directly, and
    # `next build` defers client creation to request time (see
    # src/lib/supabaseAdmin.ts).
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
      SESSION_SECRET: "ci-placeholder-at-least-thirty-two-characters-long"
      CRON_SECRET: "ci-placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Tests and coverage
        run: npm run test:coverage

      - name: PostgreSQL regression tests
        run: npm run test:database
